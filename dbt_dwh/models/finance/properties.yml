version: 2

models:
  - name: "revenue_daily"
    description: "Summary daily revenue"
    config:
      materialized: "incremental"
      incremental_strategy: "merge"
      unique_key: [ "date" ]
      on_schema_change: "append_new_columns"
      full_refresh: false
      contract:
        enforced: true
    columns:
    - name: "revenue_rub"
      description: "Daily revenue in rubles"
      data_type: "decimal(20, 2)"
    - name: "date"
      description: "Unique day"
      data_type: "date"
    - name: "updated_at"
      description: "When row was updated last time"
      data_type: "timestamptz"
  - name: "revenue_user_monthly"
    description: "Monthly total revenue by user"
    data_tests:
      - unique_key:
          arguments:
            columns: [ "user_id", "month" ]
  - name: "revenue_monthly"
    description: "Monthly total revenue"
    data_tests:
      - unique_key:
          arguments:
            columns: [ "month" ]
  - name: "revenue_monthly_report"
    description: "Monthly revenue report"
    config:
      materialized: "incremental"
      incremental_strategy: "append"
      on_schema_change: "append_new_columns"
    data_tests:
      - unique_key:
          arguments:
            columns: [ "month" ]                             

exposures:
  - name: "financial_dashboard"
    label: "Financial Dashboard"
    type: "dashboard"
    maturity: "low"
    description: "Planned consumer of revenue_daily. No BI tool is connected yet, so this exposure only records the intended dependency."
    depends_on:
      - "ref('revenue_daily')"
    owner:
      name: "Finance department"      