name: Deploy dbt docs (Data Catalog) to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Self-hosted runner: воркфлоу выполняется локально на Mac,
    # поэтому dbt подключается к локальному Docker Postgres (localhost:5432)
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Своё окружение в каталоге job, не личный .venv автора.
      - name: Install Python dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # profiles.yml закоммичен и читает креды из env_var().
      # DWH_HOST по умолчанию localhost, DWH_DB_NAME — dwh (из профиля),
      # поэтому достаточно задать пользователя и пароль от локальной базы
      - name: Install dbt packages
        working-directory: dbt_dwh
        run: ../.venv/bin/dbt deps

      - name: Run linter
        working-directory: dbt_dwh
        run: ../.venv/bin/sqlfluff lint
        env:
          DWH_USER: ${{ secrets.DWH_USER || 'admin' }}
          DWH_PASSWORD: ${{ secrets.DWH_PASSWORD || 'postgres' }}

      - name: Generate docs
        working-directory: dbt_dwh
        run: ../.venv/bin/dbt docs generate
        env:
          DWH_USER: ${{ secrets.DWH_USER || 'admin' }}
          DWH_PASSWORD: ${{ secrets.DWH_PASSWORD || 'postgres' }}

      - name: Prepare site files
        run: |
          mkdir -p site
          cp dbt_dwh/target/index.html site/
          cp dbt_dwh/target/manifest.json site/
          cp dbt_dwh/target/catalog.json site/

      - name: Commit site for GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
